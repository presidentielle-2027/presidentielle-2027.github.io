/* Animation des proximités : cible centrée sur l'utilisateur et détail axe par axe de la famille mise en avant. */
.orbit-panel{margin:25px 0}
.orbit-panel .section-intro{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.orbit-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;align-items:start}
.orbit{margin:0}
.orbit svg{display:block;width:100%;height:auto}
.orbit figcaption{font-size:12px;line-height:1.5;color:var(--muted);margin-top:10px}
.orb-zone{fill:var(--pale)}
.orb-ring{fill:none;stroke:var(--line);stroke-width:1;transform-box:fill-box;transform-origin:center}
.orb-ring.outer{stroke:var(--rideau)}
.orb-zone{transform-box:fill-box;transform-origin:center}
.orbit.intro .orb-ring,.orbit.intro .orb-zone{animation:orb-grow .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes orb-grow{from{transform:scale(.15);opacity:0}to{transform:scale(1);opacity:1}}
.orb-spoke{stroke:var(--line);stroke-width:1;transition:stroke .3s}
.orb-ray{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.orb-ray.uncompared{stroke:var(--rideau);stroke-width:1.5}
.orb-scale{font-family:var(--mono);font-size:10px;fill:var(--muted);paint-order:stroke;stroke:var(--card);stroke-width:3px}
.orb-you{fill:var(--accent);stroke:var(--card);stroke-width:3}
.orb-you-label{font-size:13.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px}
.orb-fam{cursor:pointer;outline:none;transition:transform .95s cubic-bezier(.2,.75,.25,1),opacity .6s ease}
.orb-fam .hit{fill:transparent;stroke:none}
.orb-fam .dot{fill:var(--rideau);stroke:var(--card);stroke-width:2;transition:fill .3s}
.orb-fam .halo{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
.orb-fam text{font-size:12.5px;fill:var(--muted);paint-order:stroke;stroke:var(--card);stroke-width:3px;transition:fill .3s}
.orb-fam.uncompared .dot{fill:var(--card);stroke:var(--rideau);stroke-width:1.5}
.orb-fam.uncompared text{font-style:italic}
.orb-fam:hover .dot{fill:var(--muted)}
.orb-fam.on .dot,.orb-fam.on:hover .dot{fill:var(--ink)}
.orb-fam.on text{fill:var(--ink);font-weight:600}
.orb-fam.on .halo{animation:orb-pulse 1.4s ease-out 2}
@keyframes orb-pulse{from{opacity:.55;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
.orb-fam:focus-visible .hit{stroke:var(--accent);stroke-width:2}
.orb-fam .orb-num{font-size:11px;font-weight:600;fill:var(--card);stroke:none}
.orb-fam.uncompared .orb-num{fill:var(--muted)}

window.ISOLOIR_DATA={"version":"2026.11.v3","edition":"France · novembre 2026","themes":[{"id":"economie","number":"01","name":"Économie & travail"},{"id":"societe","number":"02","name":"Société & libertés"},{"id":"monde","number":"03","name":"Écologie, Europe & monde"},{"id":"democratie","number":"04","name":"Démocratie & pouvoirs"}],"axes":[{"id":"redistribution","name":"Redistribution des richesses","shortName":"Redistribution","group":"economie","low":"Redistribution forte","high":"Redistribution limitée","description":"Mesure la place souhaitée des impôts et des transferts dans la réduction des écarts de revenus et de patrimoine.","questions":[{"id":"q01","axis":"redistribution","text":"L’impôt sur les revenus les plus élevés devrait être augmenté pour financer la solidarité.","context":"La question porte sur la contribution des ménages les plus aisés.","direction":-1},{"id":"q02","axis":"redistribution","text":"Un prélèvement annuel sur les très grands patrimoines devrait financer la solidarité nationale.","context":"Le patrimoine comprendrait aussi les participations détenues dans les entreprises.","direction":-1},{"id":"q03","axis":"redistribution","text":"Les droits de succession devraient être fortement réduits, y compris sur les héritages les plus importants.","context":"La proposition concerne également les transmissions de grande valeur.","direction":1},{"id":"q04","axis":"redistribution","text":"Les prestations de solidarité devraient se limiter à garantir un minimum de ressources.","context":"Au-delà de ce minimum, la réduction des écarts de revenus ne serait plus leur objectif.","direction":1}]},{"id":"economy","name":"Organisation de l’économie","shortName":"Économie","group":"economie","low":"Orientation publique","high":"Coordination par le marché","description":"Distingue la propriété et l’orientation publiques de la production d’une coordination reposant principalement sur les entreprises et la concurrence.","questions":[{"id":"q05","axis":"economy","text":"L’État devrait détenir une participation majoritaire dans les principales entreprises de production d’électricité.","context":"Il s’agit du contrôle de la production, indépendamment du choix des sources d’énergie.","direction":-1},{"id":"q06","axis":"economy","text":"La puissance publique devrait orienter une part importante des investissements privés vers les secteurs qu’elle juge prioritaires.","context":"La question porte sur l’orientation des investissements, pas seulement sur leur financement.","direction":-1},{"id":"q07","axis":"economy","text":"L’exploitation des lignes ferroviaires devrait être ouverte à la concurrence entre opérateurs.","context":"Le financement public d’un service resterait possible.","direction":1},{"id":"q08","axis":"economy","text":"Les entreprises devraient fixer leurs prix librement, sauf dans les situations de monopole.","context":"La proposition concerne les prix, sans supprimer les règles de sécurité des produits.","direction":1}]},{"id":"work","name":"Pouvoir dans l’entreprise","shortName":"Travail","group":"economie","low":"Pouvoir des salariés","high":"Pouvoir des dirigeants","description":"Mesure la répartition souhaitée du pouvoir de décision entre salariés, dirigeants et propriétaires dans les relations de travail.","questions":[{"id":"q09","axis":"work","text":"Les représentants des salariés devraient disposer de la moitié des sièges dans les conseils d’administration des grandes entreprises.","context":"La proposition concerne le partage des décisions de gouvernance.","direction":-1},{"id":"q10","axis":"work","text":"Une convention de branche devrait fixer des protections auxquelles une entreprise ne pourrait pas déroger à la baisse.","context":"La question porte sur la place des garanties négociées collectivement.","direction":-1},{"id":"q11","axis":"work","text":"Les propriétaires d’une entreprise devraient garder le dernier mot sur ses choix d’investissement.","context":"Les salariés pourraient être consultés sans disposer d’un pouvoir de blocage.","direction":1},{"id":"q12","axis":"work","text":"Un accord individuel entre un salarié et son employeur devrait pouvoir déroger à certaines garanties de la convention de branche.","context":"La proposition suppose l’accord explicite des deux parties.","direction":1}]},{"id":"budget","name":"Priorité budgétaire","shortName":"Budget","group":"economie","low":"Emprunt pour investir","high":"Réduction des déficits","description":"Mesure l’arbitrage entre recours à l’emprunt pour certaines dépenses et priorité donnée à la maîtrise du déficit.","questions":[{"id":"q13","axis":"budget","text":"Un investissement public utile à long terme devrait pouvoir être financé par l’emprunt, même si le déficit augmente pendant plusieurs années.","context":"La question suppose que l’utilité de l’investissement a été évaluée.","direction":-1},{"id":"q14","axis":"budget","text":"En période de récession, l’État devrait accepter une hausse temporaire du déficit pour soutenir l’activité.","context":"La proposition concerne une baisse générale de l’activité économique.","direction":-1},{"id":"q15","axis":"budget","text":"La réduction du déficit devrait primer sur le lancement de nouveaux investissements publics.","context":"La situation envisagée se situe en dehors d’une crise exceptionnelle.","direction":1},{"id":"q16","axis":"budget","text":"Une règle d’équilibre budgétaire devrait limiter durablement la possibilité de financer les dépenses publiques par l’emprunt.","context":"Des exceptions seraient prévues pour les crises exceptionnelles.","direction":1}]},{"id":"society","name":"Autonomie et normes sociales","shortName":"Choix de vie","group":"societe","low":"Autonomie personnelle","high":"Normes traditionnelles","description":"Explore la place des choix individuels par rapport à des normes familiales et morales communes.","questions":[{"id":"q17","axis":"society","text":"Les personnes majeures devraient pouvoir modifier la mention du sexe à l’état civil par une déclaration administrative.","context":"La proposition concerne uniquement la procédure d’état civil des adultes.","direction":-1},{"id":"q18","axis":"society","text":"Une personne majeure atteinte d’une maladie incurable devrait pouvoir demander une aide à mourir.","context":"La question porte sur le principe, dans un cadre médical réglementé.","direction":-1},{"id":"q19","axis":"society","text":"Les aides à la famille devraient favoriser les couples composés d’un homme et d’une femme.","context":"La proposition porte sur l’orientation des aides, pas sur l’interdiction des autres familles.","direction":1},{"id":"q20","axis":"society","text":"L’accès à la procréation médicalement assistée devrait être réservé aux couples composés d’un homme et d’une femme.","context":"La question porte sur les conditions d’accès, indépendamment du financement.","direction":1}]},{"id":"liberties","name":"Sécurité et libertés publiques","shortName":"Libertés","group":"societe","low":"Garanties des libertés","high":"Pouvoirs de sécurité étendus","description":"Mesure les arbitrages entre garanties individuelles et extension des moyens de surveillance et de maintien de l’ordre.","questions":[{"id":"q21","axis":"liberties","text":"La surveillance policière ciblant une personne identifiée devrait exiger une autorisation judiciaire préalable.","context":"La question concerne la surveillance préventive, hors urgence immédiate.","direction":-1},{"id":"q22","axis":"liberties","text":"Les usages de la force par la police devraient pouvoir être examinés par une autorité indépendante de la police et du gouvernement.","context":"Cette autorité disposerait de moyens d’enquête propres.","direction":-1},{"id":"q23","axis":"liberties","text":"La police devrait pouvoir utiliser la reconnaissance faciale en temps réel dans les lieux publics sur autorisation administrative.","context":"La proposition ne prévoit pas d’autorisation judiciaire préalable.","direction":1},{"id":"q24","axis":"liberties","text":"Un préfet devrait pouvoir interdire une manifestation en cas de risque sérieux de troubles, avant qu’une infraction soit commise.","context":"La question porte sur une interdiction préventive.","direction":1}]},{"id":"immigration","name":"Politique migratoire","shortName":"Immigration","group":"societe","low":"Accueil plus ouvert","high":"Conditions restrictives","description":"Mesure les conditions d’entrée et de séjour souhaitées, séparément des attentes d’intégration culturelle.","questions":[{"id":"q25","axis":"immigration","text":"Un étranger sans titre de séjour qui vit en France depuis plusieurs années et occupe un emploi stable devrait pouvoir être régularisé.","context":"La proposition concerne des personnes déjà présentes sur le territoire.","direction":-1},{"id":"q26","axis":"immigration","text":"La France devrait délivrer davantage de visas de travail aux personnes qui souhaitent venir y exercer une activité.","context":"La question porte sur l’immigration de travail, distincte du droit d’asile.","direction":-1},{"id":"q27","axis":"immigration","text":"Il faudrait fixer un plafond annuel d’entrées pour l’immigration en dehors du droit d’asile.","context":"Ce plafond couvrirait les autres principaux motifs d’installation.","direction":1},{"id":"q28","axis":"immigration","text":"Le regroupement familial devrait être réservé aux personnes dont le revenu dépasse nettement le salaire minimum.","context":"La proposition concerne les conditions matérielles exigées de la personne déjà installée.","direction":1}]},{"id":"integration","name":"Modèle d’intégration culturelle","shortName":"Intégration","group":"societe","low":"Pluralisme culturel","high":"Assimilation culturelle","description":"Distingue l’acceptation de cultures durablement diverses de l’exigence d’une convergence forte vers une culture nationale commune.","questions":[{"id":"q29","axis":"integration","text":"Les collectivités devraient soutenir les associations qui entretiennent les cultures d’origine de leurs habitants.","context":"La proposition concerne des activités culturelles respectant les lois communes.","direction":-1},{"id":"q30","axis":"integration","text":"L’intégration devrait être jugée d’abord sur le respect des lois, sans exiger l’abandon de pratiques culturelles licites.","context":"Les mêmes règles juridiques s’appliqueraient à tous.","direction":-1},{"id":"q31","axis":"integration","text":"L’acquisition de la nationalité française devrait exiger une adhésion démontrée aux traditions culturelles françaises.","context":"Cette exigence irait au-delà de la langue et du respect des lois.","direction":1},{"id":"q32","axis":"integration","text":"L’école devrait chercher avant tout à transmettre une culture nationale commune plutôt qu’à valoriser les cultures d’origine des élèves.","context":"La question porte sur la priorité pédagogique lorsque ces objectifs entrent en concurrence.","direction":1}]},{"id":"religion","name":"Expression religieuse et laïcité","shortName":"Laïcité","group":"societe","low":"Liberté d’expression","high":"Restrictions élargies","description":"Mesure l’étendue des restrictions souhaitées à l’expression religieuse des individus ; la neutralité des institutions publiques est admise aux deux pôles.","questions":[{"id":"q33","axis":"religion","text":"Une personne devrait pouvoir porter un signe religieux visible dans la rue dès lors que son visage reste identifiable.","context":"La question ne concerne pas les agents publics dans l’exercice de leurs fonctions.","direction":-1},{"id":"q34","axis":"religion","text":"Les usagers d’un service public devraient pouvoir porter des signes religieux lorsqu’ils utilisent ce service.","context":"Le personnel du service resterait soumis à la neutralité.","direction":-1},{"id":"q35","axis":"religion","text":"Les entreprises privées devraient pouvoir interdire de façon générale les signes religieux visibles dans leurs locaux.","context":"La proposition concerne les salariés, même sans contact avec la clientèle.","direction":1},{"id":"q36","axis":"religion","text":"Une association recevant une subvention publique devrait imposer la neutralité religieuse à ses adhérents pendant ses activités.","context":"La proposition étendrait la neutralité aux participants, pas seulement aux responsables.","direction":1}]},{"id":"discrimination","name":"Méthode de lutte contre les discriminations","shortName":"Discriminations","group":"societe","low":"Mesures ciblées","high":"Dispositifs universels","description":"Explore la méthode privilégiée pour lutter contre les discriminations : ciblage de groupes ou priorité aux règles communes et aux critères individuels et sociaux.","questions":[{"id":"q37","axis":"discrimination","text":"Des objectifs chiffrés de représentation des groupes sous-représentés devraient être imposés dans les grandes entreprises.","context":"Par exemple pour les femmes ou les personnes en situation de handicap.","direction":-1},{"id":"q38","axis":"discrimination","text":"Des places dans certaines formations devraient pouvoir être réservées à des groupes ayant subi des discriminations.","context":"La question porte sur des mesures correctrices ciblées, à qualifications minimales définies.","direction":-1},{"id":"q39","axis":"discrimination","text":"L’attribution des aides publiques devrait reposer sur des critères individuels et sociaux, sans quotas liés à l’appartenance à un groupe.","context":"La proposition concerne les critères de sélection, pas l’existence des discriminations.","direction":1},{"id":"q40","axis":"discrimination","text":"Pour lutter contre les discriminations, il faudrait privilégier des règles identiques pour tous plutôt que des dérogations ciblées.","context":"La question compare deux méthodes d’action, sans nier l’objectif d’égalité.","direction":1}]},{"id":"ecology","name":"Priorité écologique","shortName":"Écologie","group":"monde","low":"Limites écologiques","high":"Priorité à la production","description":"Mesure la priorité accordée à l’environnement quand elle entre en conflit avec l’activité ou les volumes de production ; le choix des technologies reste distinct.","questions":[{"id":"q41","axis":"ecology","text":"Un projet d’infrastructure devrait pouvoir être abandonné pour préserver un écosystème, même s’il créerait des emplois.","context":"La question suppose un conflit réel entre les deux objectifs.","direction":-1},{"id":"q42","axis":"ecology","text":"La consommation de ressources naturelles devrait être plafonnée, même si cela ralentit certaines productions.","context":"Il s’agit de limites portant sur les volumes consommés, pas seulement sur l’efficacité technique.","direction":-1},{"id":"q43","axis":"ecology","text":"Une obligation environnementale devrait pouvoir être reportée lorsqu’elle menace directement le maintien d’une activité industrielle.","context":"La question porte sur la priorité à retenir en cas de conflit avéré.","direction":1},{"id":"q44","axis":"ecology","text":"Une nouvelle installation industrielle devrait pouvoir être autorisée malgré des atteintes locales à l’environnement si elle assure une production jugée indispensable.","context":"La production envisagée ne pourrait pas être obtenue sans cet impact local.","direction":1}]},{"id":"europe","name":"Intégration européenne","shortName":"Europe","group":"monde","low":"Intégration européenne","high":"Souveraineté nationale","description":"Mesure le niveau auquel les décisions devraient être prises et la répartition souhaitée des compétences entre la France et l’Union européenne.","questions":[{"id":"q45","axis":"europe","text":"L’Union européenne devrait disposer d’une capacité permanente d’emprunt commun pour financer ses projets.","context":"Les décisions de financement seraient prises au niveau européen.","direction":-1},{"id":"q46","axis":"europe","text":"Dans davantage de domaines, les décisions européennes devraient pouvoir être prises à la majorité des États plutôt qu’à l’unanimité.","context":"Un État pourrait ainsi être engagé malgré son opposition.","direction":-1},{"id":"q47","axis":"europe","text":"La France devrait pouvoir écarter l’application d’une règle européenne lorsqu’elle contredit un choix de son Parlement.","context":"La proposition porte sur la primauté à donner à une décision nationale.","direction":1},{"id":"q48","axis":"europe","text":"Des compétences transférées à l’Union européenne devraient être rendues aux États membres.","context":"La question concerne une réduction générale du périmètre des décisions européennes.","direction":1}]},{"id":"trade","name":"Ouverture commerciale","shortName":"Commerce","group":"monde","low":"Libre-échange","high":"Protection économique","description":"Mesure l’ouverture souhaitée aux échanges et aux investissements internationaux par rapport à la protection des capacités nationales ou européennes.","questions":[{"id":"q49","axis":"trade","text":"La France devrait soutenir des accords commerciaux réduisant les droits de douane avec ses partenaires.","context":"La proposition concerne les barrières commerciales, sans supprimer les règles de sécurité des produits.","direction":-1},{"id":"q50","axis":"trade","text":"Les marchés publics devraient être ouverts aux fournisseurs étrangers sans préférence liée à leur nationalité.","context":"Les offres seraient comparées selon les mêmes exigences de qualité et de prix.","direction":-1},{"id":"q51","axis":"trade","text":"Des droits de douane plus élevés devraient protéger les productions jugées stratégiques.","context":"La question suppose que les produits importés respectent déjà les normes applicables.","direction":1},{"id":"q52","axis":"trade","text":"L’État devrait pouvoir refuser le rachat d’une entreprise stratégique par un groupe étranger, même sans risque militaire identifié.","context":"La protection de la capacité de production serait ici le motif principal.","direction":1}]},{"id":"defense","name":"Alliances et autonomie stratégique","shortName":"Défense","group":"monde","low":"Alliances intégrées","high":"Autonomie stratégique","description":"Mesure le rôle souhaité des alliances militaires permanentes par rapport à la liberté de décision et aux capacités autonomes de la France.","questions":[{"id":"q53","axis":"defense","text":"La France devrait confier davantage de missions de défense à des structures militaires communes avec ses alliés.","context":"La question porte sur une intégration permanente, pas sur une coalition ponctuelle.","direction":-1},{"id":"q54","axis":"defense","text":"La France devrait accepter un commandement militaire partagé pour certaines de ses forces.","context":"Des décisions opérationnelles seraient prises collectivement avec les alliés.","direction":-1},{"id":"q55","axis":"defense","text":"La France devrait réduire ses engagements militaires permanents au sein d’alliances pour garder davantage de liberté d’action.","context":"La coopération ponctuelle avec d’autres pays resterait possible.","direction":1},{"id":"q56","axis":"defense","text":"L’autonomie dans la production des équipements militaires devrait primer sur les économies permises par une dépendance aux alliés.","context":"La question oppose une capacité autonome à une solution extérieure moins coûteuse.","direction":1}]},{"id":"military","name":"Effort de défense","shortName":"Effort militaire","group":"monde","low":"Effort limité","high":"Effort accru","description":"Mesure la priorité accordée aux dépenses militaires et à la dissuasion nucléaire par rapport aux autres dépenses publiques et au désarmement ; le choix des alliances reste distinct.","questions":[{"id":"q73","axis":"military","text":"La hausse des dépenses militaires ne devrait pas se faire au détriment des services publics.","context":"Les crédits militaires ne seraient augmentés que si d’autres ressources sont trouvées.","direction":-1},{"id":"q74","axis":"military","text":"La France devrait s’engager dans un désarmement nucléaire négocié, y compris de ses propres armes.","context":"Le désarmement serait réciproque et vérifié.","direction":-1},{"id":"q75","axis":"military","text":"Le budget des armées devrait augmenter fortement dans les prochaines années, même si d’autres dépenses doivent baisser.","context":"La question porte sur la priorité budgétaire, pas sur le choix des équipements.","direction":1},{"id":"q76","axis":"military","text":"La France devrait consacrer au moins 3,5 % de sa richesse nationale à sa défense.","context":"C’est l’objectif retenu par les pays de l’OTAN en 2025, à l’horizon 2035.","direction":1}]},{"id":"assistance","name":"Soutien à un pays agressé","shortName":"Pays agressé","group":"monde","low":"Soutien militaire étendu","high":"Retenue et négociation","description":"Mesure l’aide que la France devrait apporter à un pays européen envahi, entre un soutien militaire et financier étendu et la priorité donnée à la retenue ou à une issue négociée.","questions":[{"id":"q77","axis":"assistance","text":"Lorsqu’un pays européen est envahi, la France devrait lui livrer des armes capables de frapper des cibles militaires sur le territoire de l’agresseur.","context":"La France n’enverrait pas de troupes combattantes.","direction":-1},{"id":"q78","axis":"assistance","text":"Les avoirs publics d’un État agresseur gelés en Europe devraient être saisis pour financer la défense du pays agressé.","context":"Il s’agit de saisir le capital, pas seulement les intérêts qu’il produit.","direction":-1},{"id":"q79","axis":"assistance","text":"La France devrait réduire son aide financière à un pays agressé lorsque son propre budget est sous tension.","context":"L’aide humanitaire serait maintenue.","direction":1},{"id":"q80","axis":"assistance","text":"Un cessez-le-feu rapide devrait primer sur la poursuite du soutien militaire, même si l’agresseur conserve une partie du territoire conquis.","context":"La question oppose deux priorités dans un conflit qui dure.","direction":1}]},{"id":"checks","name":"Limitation du pouvoir politique","shortName":"Contre-pouvoirs","group":"democratie","low":"Contre-pouvoirs forts","high":"Primauté de la majorité","description":"Mesure l’étendue des limites et contrôles opposables à une majorité politique ; cet axe est distinct de la force de l’exécutif et de la participation citoyenne.","questions":[{"id":"q57","axis":"checks","text":"Le Conseil constitutionnel devrait pouvoir empêcher l’application d’une loi majoritaire qui porte atteinte aux droits fondamentaux.","context":"La question porte sur la capacité effective de contrôle du pouvoir politique.","direction":-1},{"id":"q58","axis":"checks","text":"La direction des médias publics devrait être protégée de toute nomination directement décidée par le gouvernement.","context":"La proposition concerne leur indépendance à l’égard du pouvoir exécutif.","direction":-1},{"id":"q59","axis":"checks","text":"Une loi approuvée par référendum devrait pouvoir s’imposer malgré une censure du Conseil constitutionnel.","context":"La proposition donne ici la priorité à la décision majoritaire.","direction":1},{"id":"q60","axis":"checks","text":"La majorité élue devrait pouvoir remplacer certaines autorités administratives indépendantes par des services placés sous son autorité.","context":"La question porte sur le contrôle politique de missions confiées à des organismes autonomes.","direction":1}]},{"id":"executive","name":"Équilibre exécutif et Parlement","shortName":"Exécutif","group":"democratie","low":"Prépondérance parlementaire","high":"Exécutif fort","description":"Mesure la répartition du pouvoir entre gouvernement, présidence et assemblées, sans présumer du respect des libertés ou des contre-pouvoirs.","questions":[{"id":"q61","axis":"executive","text":"Le gouvernement devrait pouvoir être renversé par un vote à la majorité simple de l’Assemblée nationale.","context":"La question porte sur la responsabilité du gouvernement devant les députés.","direction":-1},{"id":"q62","axis":"executive","text":"Le Parlement devrait maîtriser l’essentiel de son ordre du jour législatif.","context":"Le gouvernement ne disposerait pas d’une priorité générale sur les textes examinés.","direction":-1},{"id":"q63","axis":"executive","text":"Le président devrait pouvoir choisir le gouvernement sans vote préalable d’investiture de l’Assemblée nationale.","context":"Le contrôle parlementaire pourrait intervenir après sa nomination.","direction":1},{"id":"q64","axis":"executive","text":"Le gouvernement devrait pouvoir faire adopter un budget sans vote positif des députés s’ils ne réunissent pas une majorité pour le renverser.","context":"La question concerne un mécanisme d’adoption lié à la responsabilité gouvernementale.","direction":1}]},{"id":"participation","name":"Participation directe des citoyens","shortName":"Participation","group":"democratie","low":"Délégation aux élus","high":"Participation directe","description":"Mesure la place souhaitée des décisions directes des citoyens en complément ou à la place de la représentation élective.","questions":[{"id":"q65","axis":"participation","text":"Les élus devraient garder la décision finale après les travaux d’une convention citoyenne.","context":"La convention aurait ici un rôle de proposition et de consultation.","direction":-1},{"id":"q66","axis":"participation","text":"Un député devrait exercer son mandat jusqu’à l’élection suivante sans pouvoir être révoqué par une pétition citoyenne.","context":"Les électeurs conserveraient leur pouvoir de sanction lors du scrutin suivant.","direction":-1},{"id":"q67","axis":"participation","text":"Un nombre suffisant de signatures citoyennes devrait permettre de déclencher un référendum national.","context":"La question porte sur un droit d’initiative indépendant de la volonté du gouvernement.","direction":1},{"id":"q68","axis":"participation","text":"Une part du budget d’une commune devrait être directement décidée par ses habitants.","context":"Les habitants choisiraient les projets dans une enveloppe définie.","direction":1}]},{"id":"territory","name":"Organisation territoriale","shortName":"Territoires","group":"democratie","low":"Centralisation","high":"Décentralisation","description":"Mesure le niveau territorial auquel les compétences, les règles et les ressources publiques devraient être décidées.","questions":[{"id":"q69","axis":"territory","text":"Les règles des principaux services publics devraient être les mêmes dans toutes les régions.","context":"La priorité serait donnée à l’uniformité nationale plutôt qu’à l’adaptation locale.","direction":-1},{"id":"q70","axis":"territory","text":"L’État devrait fixer l’essentiel des moyens financiers attribués aux collectivités locales.","context":"La question porte sur la maîtrise des ressources, pas sur la suppression des collectivités.","direction":-1},{"id":"q71","axis":"territory","text":"Les collectivités devraient disposer de davantage de liberté pour fixer leurs propres impôts.","context":"Des mécanismes nationaux de solidarité pourraient être conservés.","direction":1},{"id":"q72","axis":"territory","text":"Les régions devraient pouvoir adapter certaines normes nationales aux particularités de leur territoire.","context":"La proposition concerne des compétences définies, dans un cadre constitutionnel commun.","direction":1}]}],"references":{"thinkers":[{"id":"agacinski","name":"Sylviane Agacinski","discipline":"Philosophie","role":"EHESS"},{"id":"alesina","name":"Alberto Alesina","years":"1957–2020","discipline":"Économie","role":"Université Harvard"},{"id":"allais","name":"Maurice Allais","years":"1911–2010","discipline":"Économie","role":"prix Nobel 1988"},{"id":"anderson","name":"Elizabeth Anderson","discipline":"Philosophie","role":"Université du Michigan"},{"id":"aron","name":"Raymond Aron","years":"1905–1983","discipline":"Sociologie et philosophie","role":"Collège de France"},{"id":"badinter","name":"Élisabeth Badinter","discipline":"Philosophie","role":"Écol "r-posner","name":"Richard A. Posner","discipline":"Droit","role":"Université de Chicago, ancien juge fédéral"},{"id":"renan","name":"Ernest Renan","years":"1823–1892","discipline":"Histoire et philologie"},{"id":"ricot","name":"Jacques Ricot","discipline":"Philosophie","role":"Université de Nantes"},{"id":"ritchie","name":"Hannah Ritchie","discipline":"Données environnementales","role":"Université d’Oxford, Our World in Data"},{"id":"rodrik","name":"Dani Rodrik","discipline":"Économie","role":"Université Harvard"},{"id":"rosanvallon","name":"Pierre Rosanvallon","discipline":"Histoire et théorie politique","role":"Collège de France"},{"id":"roussellier","name":"Nicolas Roussellier","discipline":"Histoire politique","role":"Sciences Po"},{"id":"salin","name":"Pascal Salin","discipline":"Économie","role":"Université Paris-Dauphine"},{"id":"sapir","name":"Jacques Sapir","discipline":"Économie","role":"EHESS"},{"id":"scharpf","name":"Fritz W. Scharpf","discipline":"Science politique","role":"Institut Max-Planck pour l’étude des sociétés"},{"id":"schnapper","name":"Dominique Schnapper","discipline":"Sociologie","role":"EHESS"},{"id":"schoettl","name":"Jean-Éric Schoettl","discipline":"Droit public","role":"conseiller d’État honoraire"},{"id":"seguin","name":"Philippe Séguin","years":"1943–2010","discipline":"Responsable politique","role":"président de l’Assemblée nationale (1993–1997)"},{"id":"senac","name":"Réjane Sénac","discipline":"Science politique","role":"CNRS, Sciences Po"},{"id":"sieyes","name":"Emmanuel-Joseph Sieyès","years":"1748–1836","discipline":"Philosophie politique"},{"id":"smith","name":"Adam Smith","years":"1723–1790","discipline":"Économie et philosophie"},{"id":"stael","name":"Germaine de Staël","years":"1766–1817","discipline":"Philosophie politique et lettres"},{"id":"stantcheva","name":"Stefanie Stantcheva","discipline":"Économie","role":"Université Harvard"},{"id":"taylor","name":"Charles Taylor","discipline":"Philosophie","role":"Université McGill"},{"id":"tenenbaum","name":"Élie Tenenbaum","discipline":"Histoire et études stratégiques","role":"IFRI"},{"id":"tertrais","name":"Bruno Tertrais","discipline":"Études stratégiques","role":"Fondation pour la recherche stratégique"},{"id":"thery","name":"Irène Théry","discipline":"Sociologie","role":"EHESS"},{"id":"tirole","name":"Jean Tirole","discipline":"Économie","role":"Toulouse School of Economics, prix Nobel 2014"},{"id":"tocqueville","name":"Alexis de Tocqueville","years":"1805–1859","discipline":"Philosophie politique"},{"id":"tribalat","name":"Michèle Tribalat","discipline":"Démographie","role":"INED"},{"id":"urbinati","name":"Nadia Urbinati","discipline":"Théorie politique","role":"Université Columbia"},{"id":"vegece","name":"Végèce","years":"IVe–Ve siècle","discipline":"Écrits militaires"},{"id":"vermeule","name":"Adrian Vermeule","discipline":"Droit","role":"Université Harvard"},{"id":"waldron","name":"Jeremy Waldron","discipline":"Philosophie du droit","role":"Université de New York"},{"id":"walzer","name":"Michael Walzer","discipline":"Philosophie politique","role":"Institute for Advanced Study, Princeton"},{"id":"wieviorka","name":"Michel Wieviorka","discipline":"Sociologie","role":"EHESS"},{"id":"wihtol-de-wenden","name":"Catherine Wihtol de Wenden","discipline":"Science politique","role":"CNRS, Sciences Po"},{"id":"zucman","name":"Gabriel Zucman","discipline":"Économie","role":"École normale supérieure, Observatoire européen de la fiscalité"}],"arguments":[{"axis":"redistribution","pole":"low","authors":["piketty"],"featured":true,"thesis":"Le retour à un impôt fortement progressif sur les revenus et les patrimoines est une exigence de justice, et une condition d’une démocratie économique plus étendue.","nuance":"Le socialisme participatif qu’il défend se distingue explicitement d’un socialisme d’État centralisé.","quote":"Le mouvement de retour vers l’impôt progressif et une plus grande justice qui se dégage aujourd’hui a quelque chose d’évident, et n’a que trop tardé.","source":{"title":"L’ISF en Amérique, blog du Monde","year":2019,"url":"https://www.lemonde.fr/blog/piketty/2019/02/12/lisf-en-amerique/","archive":["research/sources/penseurs/piketty-isf-en-amerique-2019.html"]}},{"axis":"redistribution","pole":"low","authors":["zucman"],"featured":true,"thesis":"Un impôt plancher égal à 2 % du patrimoine, réservé aux fortunes de plus de 100 millions d’euros, rétablirait une contribution aujourd’hui faible au regard de leur patrimoine.","nuance":"Ce n’est pas une surtaxe : celui qui paie déjà 2 % de son patrimoine en impôts personnels n’aurait rien de plus à payer. Le rendement et les comportements d’évitement font débat.","quote":"Une personne payant moins de 2 % du montant de son patrimoine en impôts personnels devrait s'acquitter de la différence pour atteindre le plancher de 2 %.","source":{"title":"Audition par la commission d’enquête sur l’imposition des plus hauts patrimoines, Assemblée nationale","year":2026,"url":"https://www.assemblee-nationale.fr/dyn/17/comptes-rendus/cepat/l17cepat2526022_compte-rendu.pdf","archive":["research/sources/penseurs/zucman-audition-an-2026-05-06.pdf"]}},{"axis":"redistribution","pole":"low","authors":["fack"],"featured":false,"thesis":"Avec ses coauteurs du Conseil d’analyse économique, elle propose d’imposer l’ensemble des transmissions reçues au cours de la vie, pour réduire les inégalités de patrimoine héritées.","nuance":"La réforme réduirait les droits de succession de la grande majorité des héritiers et alourdirait ceux des plus grandes transmissions.","quote":"la mise en place d’une politique de taxation sur le flux successoral total perçu par l’individu tout au long de sa vie afin de réduire les inégalités de patrimoine issues de l’héritage","source":{"title":"Repenser l’héritage, note du Conseil d’analyse économique n° 69","year":2021,"url":"https://cae-eco.fr/static/pdf/cae-note069s.pdf","archive":["research/sources/penseurs/cae-note-69-repenser-heritage-2021.pdf"]}},{"axis":"redistribution","pole":"low","authors":["stantcheva"],"featured":false,"thesis":"Lorsque les plus hauts revenus tiennent en partie à un pouvoir de négociation, les taux marginaux supérieurs souhaitables sont plus élevés qu’on ne le suppose généralement.","source":{"title":"Optimal Taxation of Top Labor Incomes, avec Thomas Piketty et Emmanuel Saez, NBER","year":2013,"url":"https://www.nber.org/system/files/working_papers/w17616/w17616.pdf","archive":["research/sources/penseurs/piketty-saez-stantcheva-nber-17616.pdf"]}},{"axis":"redistribution","pole":"low","authors":["duflo"],"featured":false,"thesis":"Les plus grandes fortunes ne paient pas leur juste part d’impôt ; les taxer davantage permettrait de financer l’adaptation des pays pauvres au changement climatique.","source":{"title":"Tax the rich and save the planet, conférence TED","year":2025,"url":"https://www.ted.com/talks/esther_duflo_tax_the_rich_and_save_the_planet/transcript","archive":["research/sources/penseurs/duflo-ted-2025.html"]}},{"axis":"redistribution","pole":"high","authors":["nozick"],"featured":true,"thesis":"Seul un État minimal, limité à la protection contre la force, le vol et la fraude, est justifié ; il ne peut contraindre certains citoyens à en aider d’autres.","nuance":"Il admet des transferts destinés à réparer des injustices passées dans l’acquisition des biens.","source":{"title":"Anarchie, État et utopie, présentation de l’édition française, PUF, collection Quadrige","year":1974,"url":"https://www.puf.com/anarchie-etat-et-utopie","archive":["research/sources/penseurs/nozick-anarchie-etat-utopie-puf.html"]}},{"axis":"redistribution","pole":"high","authors":["salin"],"featured":true,"thesis":"La progressivité de l’impôt décourage l’effort supplémentaire, le plus difficile à fournir ; l’extension des prélèvements est incompatible avec une société de liberté.","nuance":"Sa critique vise l’extension de l’État en général, pas seulement la redistribution.","quote":"L'effort marginal – c'est-à-dire celui qui est le plus difficile à faire – est en effet découragé par le système de prélèvements obligatoires, en particulier par la progressivité de l'impôt sur le revenu.","source":{"title":"Un impôt mondial pour financer l’après-crise ?, Institut Libéral","year":2022,"url":"https://www.libinst.ch/publications/IL-Salin-Impot%20mondial.pdf","archive":["research/sources/penseurs/salin-impot-mondial-institut-liberal-2022.pdf"]}},{"axis":"economy","pole":"low","authors":["mazzucato"],"featured":true,"thesis":"L’État ne se borne pas à corriger les défaillances du marché : par des missions de recherche et d’innovation, il oriente l’économie et contribue à créer de nouveaux marchés.","nuance":"Les missions qu’elle décrit associent les entreprises privées ; elle ne plaide pas pour une propriété publique généralisée.","source":{"title":"Mission-Oriented Research & Innovation in the European Union, Commission européenne","year":2018,"url":"https://www.era.gv.at/public/documents/3483/mazzucato_report_2018.pdf","archive":["research/sources/penseurs/mazzucato-mission-oriented-2018.pdf"]}},{"axis":"economy","pole":"low","authors":["keynes"],"featured":true,"thesis":"Une demande insuffisante peut maintenir durablement le sous-emploi ; une socialisation assez large de l’investissement est le moyen d’approcher le plein emploi.","nuance":"Il conserve une large place à l’initiative privée et à la coopération entre la puissance publique et les entreprises.","quote":"Aussi pensons-nous qu'une assez large socialisation de l'investissement s'avèrera le seul moyen d'assurer approximativement le plein emploi","source":{"title":"Théorie générale de l’emploi, de l’intérêt et de la monnaie, chapitre 24, traduction Jean de Largentaye (1942), Les Classiques des sciences sociales","year":1936,"url":"https://web.archive.org/web/20180421230746id_/http://classiques.uqac.ca/classiques/keynes_john_maynard/theorie_gen_emploi/theorie_emploi_monnaie_2.pdf","archive":["research/sources/penseurs/keynes-theorie-generale-livres-4-6-largentaye.pdf"]}},{"axis":"economy","pole":"low","authors":["marx"],"featured":false,"thesis":"La propriété des moyens de production structure les rapports entre capital et travail ; le Manifeste prévoit de centraliser progressivement les instruments de production entre les mains de l’État.","nuance":"C’est un texte de combat de 1848, écrit dans un contexte révolutionnaire.","quote":"Le prolétariat se servira de sa suprématie politique pour arracher petit à petit tout le capital à la bourgeoisie, pour centraliser tous les instruments de production entre les mains de l'Etat","source":{"title":"Manifeste du parti communiste, avec Friedrich Engels, chapitre II","year":1848,"url":"https://www.marxists.org/francais/marx/works/1847/00/kmfe18470000b.htm","archive":["research/sources/penseurs/marx-engels-manifeste-ch2.html"]}},{"axis":"economy","pole":"low","authors":["pisani-ferry","mahfouz"],"featured":false,"thesis":"La transition écologique sera pilotée d’abord par les politiques publiques : elle demande des investissements massifs, des choix explicites de financement et une répartition équitable des coûts.","nuance":"Le rapport ne renonce pas au prix du carbone, qui oriente les décisions de façon décentralisée.","quote":"cette transformation sera globale, plus rapide, et elle sera pilotée d’abord par les politiques publiques et non par les innovations technologiques et les marchés.","source":{"title":"Les incidences économiques de l’action pour le climat, France Stratégie","year":2023,"url":"https://www.strategie-plan.gouv.fr/files/files/Publications/Rapport/2023-incidences-economiques-rapport-pisani-5juin.pdf","archive":["research/sources/penseurs/pisani-ferry-mahfouz-incidences-economiques-2023.pdf"]}},{"axis":"economy","pole":"high","authors":["hayek"],"featured":true,"thesis":"L’information économique est dispersée entre les individus ; le système des prix la coordonne sans qu’aucun planificateur puisse la réunir.","nuance":"Son argument porte sur la connaissance ; il défend un cadre de règles générales, pas l’absence de règles.","quote":"Nous devons considérer le système des prix comme un mécanisme de communication de l'information si nous voulons comprendre sa fonction réelle","source":{"title":"L’utilisation de la connaissance dans la société, traduction Véronique de Mareuil révisée par Emmanuel Martin, Laissons Faire n° 26, Institut Coppet","year":1945,"url":"https://www.coppetinstitute.org/EL/LaissonsFaire.No26_.Octobre2018-17-27.pdf","archive":["research/sources/penseurs/hayek-utilisation-connaissance-laissons-faire-26.pdf"]}},{"axis":"economy","pole":"high","authors":["tirole"],"featured":true,"thesis":"La concurrence protège les consommateurs et limite l’influence des intérêts particuliers ; l’État doit surtout réguler les marchés imparfaits plutôt que s’y substituer.","nuance":"Il souligne lui-même que la concurrence est rarement parfaite et que les marchés ont des failles.","quote":"La libre concurrence en effet protège les consommateurs de l’influence politique des lobbies et conduit les producteurs à proposer leurs biens et services à prix coûtant.","source":{"title":"Conférence Nobel, traduction publiée par la Toulouse School of Economics","year":2015,"url":"https://www.tse-fr.eu/sites/default/files/TSE/documents/doc/by/tirole/nobel_lecture_fr_30_mars_2015_partenaires_idei.pdf","archive":["research/sources/penseurs/tirole-conference-nobel-2014-fr.pdf"]}},{"axis":"economy","pole":"high","authors":["gollier"],"featured":false,"thesis":"Pour conduire la transition écologique, l’État doit envoyer des incitations, comme un prix du carbone, plutôt qu’imposer des obligations.","quote":"Il est difficile d'imaginer que l'État puisse en être le chef d'orchestre sans envoyer des incitations plutôt que des obligations.","source":{"title":"Entretien, La Vie des idées","year":2022,"url":"https://laviedesidees.fr/IMG/pdf/20221202_gollier.pdf","archive":["research/sources/penseurs/gollier-vie-des-idees-2022.pdf"]}},{"axis":"economy","pole":"high","authors":["salin"],"featured":false,"thesis":"La liberté individuelle, l’échange volontaire et la propriété doivent guider l’organisation économique ; accroître la part des activités publiques s’en éloigne.","quote":"Il est évident qu’on ne peut pas considérer comme libéral un président qui accroît les activités publiques par rapport aux activités privées.","source":{"title":"Les Français doivent retrouver le goût de la liberté individuelle, entretien, Revue politique et parlementaire","year":2022,"url":"https://www.revuepolitique.fr/les-francais-doivent-retrouver-le-gout-de-la-liberte-individuelle-une-interview-du-professeur-pascal-salin/","archive":["research/sources/penseurs/salin-revue-politique-2022.html"]}},{"axis":"work","pole":"low","authors":["ferreras"],"featured":true,"thesis":"Le gouvernement de l’entreprise devrait être soumis à une double majorité : celle des apporteurs de capital et celle des représentants des salariés.","nuance":"Le texte, signé par des milliers de chercheurs, propose aussi une garantie d’emploi ; il ne supprime pas la représentation du capital.","quote":"Ces Chambres de représentation des travailleurs doivent désormais être dotées de droits similaires à ceux des Conseils d’administration, afin de soumettre le gouvernement de l’entreprise (le top management) à une double majorité.","source":{"title":"Travail. Démocratiser. Démarchandiser. Dépolluer, tribune avec Julie Battilana et Dominique Méda","year":2020,"url":"https://www.DemocratizingWork.org/s/Work_Democratize_Decommodify_Remediate_FRA.pdf","archive":["research/sources/penseurs/ferreras-battilana-meda-democratiser-2020.pdf"]}},{"axis":"work","pole":"low","authors":["piketty"],"featured":true,"thesis":"Donner aux salariés entre un tiers et la moitié des sièges des conseils d’administration rapprocherait la France des modèles allemand et nordique.","quote":"si le gouvernement français décidait d’amplifier le mouvement en introduisant un nombre substantiel de sièges pour les salariés (mettons, entre un tiers et la moitié, de façon à rejoindre l’axe germano-nordique), il s’agirait d’un acte majeur","source":{"title":"Repenser le code du capital, blog du Monde","year":2017,"url":"https://www.lemonde.fr/blog/piketty/2017/09/12/repenser-le-code-du-capital/","archive":["research/sources/penseurs/piketty-repenser-code-capital-2017.html"]}},{"axis":"work","pole":"low","authors":["marx"],"featured":false,"thesis":"La grande production moderne peut se passer d’une classe de patrons employant une classe de salariés : l’Adresse de 1864 en voit la preuve dans les coopératives ouvrières.","quote":"la production sur une grande échelle et au niveau des exigences de la science moderne pouvait se passer d'une classe de patrons employant une classe de salariés","source":{"title":"Adresse inaugurale de l’Association internationale des travailleurs","year":1864,"url":"https://www.marxists.org/francais/marx/works/1864/09/18640928.htm","archive":["research/sources/penseurs/marx-adresse-inaugurale-ait-1864.html"]}},{"axis":"work","pole":"high","authors":["friedman"],"featured":true,"thesis":"Le dirigeant d’une entreprise est l’employé de ses propriétaires : il leur doit de la gérer selon leurs intérêts, en général l’accroissement des profits dans le respect des lois.","nuance":"Il distingue ce que les actionnaires font de leur argent à titre personnel de ce que le dirigeant peut engager en leur nom.","source":{"title":"The Social Responsibility of Business Is to Increase Its Profits, New York Times Magazine","year":1970,"url":"https://business.pitt.edu/wp-content/uploads/2025/02/25Right-Readings-Friedman-1.pdf","archive":["research/sources/penseurs/friedman-social-responsibility-1970.pdf"]}},{"axis":"work","pole":"high","authors":["cette","barthelemy"],"featured":true,"thesis":"L’accord collectif d’entreprise devrait devenir la règle, la loi et la branche ne fixant plus qu’un socle d’ordre public.","nuance":"Ils défendent des accords signés par les représentants des salariés, non des décisions unilatérales de la direction.","quote":"La logique proposée, dans un premier temps, est de faire de la dérogation conventionnelle la règle.","source":{"title":"Réformer le droit du travail, Odile Jacob et Terra Nova","year":2015,"url":"https://tnova.fr/site/assets/files/10876/02092015_-_r_former_le_droit_du_travail.pdf","archive":["research/sources/penseurs/barthelemy-cette-reformer-droit-travail-2015.pdf"]}},{"axis":"budget","pole":"low","authors":["blanchard"],"featured":true,"thesis":"Tant que le taux d’intérêt reste inférieur au taux de croissance, la dette publique coûte peu au budget et au bien-être : elle ne doit pas empêcher les dépenses utiles.","nuance":"Il précise ne pas plaider pour davantage de dette ; la remontée des taux depuis 2022 modifie le calcul.","quote":"Que le coût de la dette, que ce soit le coût budgétaire, ou le coût en termes de bien-être, était beaucoup plus faible qu'il avait été dans le passé, et que ceci avait des implications importantes pour la politique budgétaire.","source":{"title":"La baisse du taux d’intérêt est un phénomène mondial, conversation, Le Grand Continent","year":2023,"url":"https://legrandcontinent.eu/fr/2023/01/22/la-baisse-du-taux-dinteret-est-un-phenomene-mondial-une-conversation-avec-olivier-blanchard/","archive":["research/sources/penseurs/blanchard-grand-continent-2023.html"]}},{"axis":"budget","pole":"low","authors":["pisani-ferry","mahfouz"],"featured":true,"thesis":"Retarder l’effort de transition au nom de la maîtrise de la dette serait contre-productif ; un recours mesuré à l’endettement doit rester possible.","nuance":"Le rapport ne fait pas de l’endettement le premier instrument de financement ; il propose aussi un prélèvement exceptionnel sur les patrimoines financiers les plus élevés.","quote":"Il ne sert à rien de retarder les efforts au nom de la maîtrise de la dette publique.","source":{"title":"Les incidences économiques de l’action pour le climat, France Stratégie","year":2023,"url":"https://www.strategie-plan.gouv.fr/files/files/Publications/Rapport/2023-incidences-economiques-rapport-pisani-5juin.pdf","archive":["research/sources/penseurs/pisani-ferry-mahfouz-incidences-economiques-2023.pdf"]}},{"axis":"budget","pole":"high","authors":["buchanan"],"featured":true,"thesis":"Une fois abandonnée la règle d’équilibre budgétaire, la démocratie penche durablement vers le déficit, qui permet de dépenser sans lever ouvertement l’impôt ; il faut rétablir cette règle.","nuance":"C’est un argument sur les institutions budgétaires, pas un refus de la dépense publique.","source":{"title":"The Consequences of Mr Keynes, avec Richard E. Wagner, Institute of Economic Affairs","year":1978,"url":"https://iea.org.uk/wp-content/uploads/2016/07/THE%20CONSEQUENCES%20OF%20MR%20KEYNES.pdf","archive":["research/sources/penseurs/buchanan-wagner-consequences-keynes-1978.pdf"]}},{"axis":"budget","pole":"high","authors":["alesina"],"featured":true,"thesis":"Les ajustements fondés sur la baisse des dépenses réduisent plus sûrement déficit et dette, et freinent moins l’activité, que ceux fondés sur les hausses d’impôts.","nuance":"Sa thèse d’une austérité favorable à la croissance est discutée, notamment par le FMI.","source":{"title":"Large Changes in Fiscal Policy: Taxes versus Spending, avec Silvia Ardagna, NBER","year":2009,"url":"https://www.nber.org/system/files/working_papers/w15438/w15438.pdf","archive":["research/sources/penseurs/alesina-ardagna-nber-15438.pdf"]}},{"axis":"budget","pole":"high","authors":["benassy-quere"],"featured":false,"thesis":"Mieux vaut conserver une capacité d’endettement pour faire face à l’imprévu que la consommer immédiatement.","nuance":"Elle distingue cette prudence d’une stratégie d’investissement public de long terme.","quote":"La bonne gestion du risque est alors de conserver la capacité d’endettement supplémentaire pour affronter l’imprévu plutôt que de la brûler immédiatement.","source":{"title":"« Quoi qu’il en coûte » : c’est combien ?, billet de la cheffe économiste de la DG Trésor","year":2021,"url":"https://www.tresor.economie.gouv.fr/Articles/2021/02/22/quoiqu-il-en-coute-c-est-combien","archive":["research/sources/penseurs/benassy-quere-quoi-qu-il-en-coute-2021.html"]}},{"axis":"society","pole":"low","authors":["mill"],"featured":true,"thesis":"La société ne peut contraindre un individu que pour l’empêcher de nuire à autrui ; pour ce qui ne concerne que lui-même, son corps et son esprit, il décide seul.","nuance":"Le principe vaut pour les adultes ; il n’interdit ni de conseiller ni de critiquer.","quote":"Pour ce qui n'intéresse que lui, son indépendance est, de droit, absolue. Sur lui-même, sur son corps et sur son esprit, l'individu est souverain.","source":{"title":"De la liberté, chapitre I, traduction Dupont-White (1860), Wikisource","year":1859,"url":"https://fr.wikisource.org/wiki/De_la_libert%C3%A9/01","archive":["research/sources/penseurs/mill-de-la-liberte-ch1.html"]}},{"axis":"society","pole":"low","authors":["thery"],"featured":true,"thesis":"La filiation repose sur l’engagement parental ; l’assistance médicale à la procréation avec donneur devrait être ouverte aux couples de femmes dans les mêmes conditions qu’aux autres couples.","nuance":"C’est la conclusion d’un groupe de travail remise aux ministres, avec la rapporteure Anne-Marie Leroyer.","quote":"Ouvrir l'accès à l'assistance médicale avec tiers donneur aux couples de femmes, dans les mêmes conditions que pour les couples de sexe différent.","source":{"title":"Filiation, origines, parentalité, rapport du groupe de travail présidé par Irène Théry","year":2014,"url":"https://www.vie-publique.fr/files/rapport/pdf/144000203.pdf","archive":["research/sources/penseurs/thery-leroyer-filiation-origines-parentalite-2014.pdf"]}},{"axis":"society","pole":"low","authors":["pelluchon"],"featured":false,"thesis":"Une aide médicale à mourir peut se concevoir pour une personne atteinte d’une maladie incurable en phase avancée, comme ultime recours examiné au cas par cas.","nuance":"Elle refuse d’en faire un droit ou une liberté, et redoute qu’elle supplée au manque de soins palliatifs.","quote":"à condition qu'on la présente comme un ultime recours, et non comme l'expression d'un « droit » à mourir dans la dignité ni même d'une liberté.","source":{"title":"Un ultime recours, au cas par cas, La Grande Conversation","year":2022,"url":"https://www.lagrandeconversation.com/app/uploads/2022/12/Un-ultime-recours-au-cas-par-cas-La-Grande-Conversation.pdf","archive":["research/sources/penseurs/pelluchon-ultime-recours-2022.pdf"]}},{"axis":"society","pole":"high","authors":["ricot"],"featured":true,"thesis":"L’aide à mourir romprait avec les lois de 2005 et 2016, qui accompagnent ceux qui vont mourir sans répondre à la demande de ceux qui veulent mourir.","nuance":"Il fonde sa position sur l’éthique du soin et se dit profondément laïque.","quote":"J'aime beaucoup la formule qui distingue ceux qui vont mourir, parfaitement armés par nos lois actuelles, et ceux qui veulent mourir.","source":{"title":"Audition par la commission des affaires sociales du Sénat","year":2025,"url":"https://www.senat.fr/compte-rendu-commissions/20250707/soci.html","archive":["research/sources/penseurs/ricot-audition-senat-2025-07-09.html"]}},{"axis":"society","pole":"high","authors":["agacinski"],"featured":true,"thesis":"La filiation repose sur l’asymétrie des deux sexes ; ouvrir la PMA aux femmes seules et aux couples de femmes effacerait la part de l’autre sexe dans la procréation.","nuance":"Elle approuve le mariage entre personnes de même sexe ; son argument tient à la différence des sexes et à la critique de la marchandisation du corps, non à la religion.","quote":"le principe de l'asymétrie des deux sexes dans la filiation serait abandonné. De plus, dans la mesure où la PMA s'effectue par don anonyme, la participation de l'autre sexe à la procréation serait tout simplement effacée.","source":{"title":"Audition par la mission d’information sur la politique familiale, Assemblée nationale","year":2019,"url":"https://www.assemblee-nationale.fr/dyn/15/comptes-rendus/polfamf/l15polfamf1819002_compte-rendu.pdf","archive":["research/sources/penseurs/agacinski-audition-an-2019-09-09.pdf"]}},{"axis":"society","pole":"high","authors":["burke"],"featured":false,"thesis":"Les usages et les préjugés hérités contiennent une raison accumulée par les générations : il est plus sage de les conserver que de refaire les mœurs par la seule raison abstraite.","nuance":"Il admet la réforme graduelle : un État privé des moyens de changer serait privé des moyens de se conserver.","quote":"Le préjugé fait de la vertu une habitude pour les hommes, et non pas une suite d'actions incohérentes ; par les préjugés dont la vertu fait la base, le devoir devient une partie de notre nature.","source":{"title":"Réflexions sur la Révolution de France, traduction de 1819, Wikisource","year":1790,"url":"https://fr.wikisource.org/wiki/R%C3%A9flexions_sur_la_r%C3%A9volution_de_France_-_1819/R%C3%A9flexions","archive":["research/sources/penseurs/burke-reflexions-revolution-1819.html"]}},{"axis":"society","pole":"high","authors":["binet"],"featured":false,"thesis":"L’intérêt de l’enfant commande de ne pas le priver par avance de toute filiation paternelle ; l’assistance médicale à la procréation devrait rester réservée aux couples formés d’un homme et d’une femme.","nuance":"Il demande surtout la prudence : une ouverture subordonnée à des études incontestables.","quote":"est-il en mesure de garantir la prise en compte de l'intérêt de l'enfant en le privant de toute possibilité d'avoir une filiation paternelle ?","source":{"title":"Audition par la commission spéciale sur la bioéthique, Sénat","year":2019,"url":"https://www.senat.fr/compte-rendu-commissions/20191125/cs_bioethique.html","archive":["research/sources/penseurs/binet-audition-senat-2019-11-28.html"]}},{"axis":"liberties","pole":"low","authors":["montesquieu"],"featured":true,"thesis":"Tout pouvoir tend à l’abus : la liberté exige que le pouvoir arrête le pouvoir, et que la puissance de juger soit séparée de celle d’exécuter.","nuance":"Il définit la liberté politique par la sûreté : liberté et sécurité ne s’opposent pas chez lui.","quote":"Pour qu'on ne puisse abuser du pouvoir, il faut que, par la disposition des choses, le pouvoir arrête le pouvoir.","source":{"title":"De l’esprit des lois, livre XI, Wikisource","year":1748,"url":"https://fr.wikisource.org/wiki/De_l%E2%80%99esprit_des_lois_(%C3%A9d._Nourse)/Livre_11","archive":["research/sources/penseurs/montesquieu-esprit-des-lois-livre-11.html"]}},{"axis":"liberties","pole":"low","authors":["delmas-marty"],"featured":true,"thesis":"La « culture de la peur » durcit le contrôle social ; les mesures fondées sur la seule dangerosité et l’exception devenue permanente menacent les libertés et l’État de droit.","nuance":"Elle tient l’insécurité pour une réalité que l’État a le devoir de combattre ; elle critique la dérive, non le contrôle.","quote":"elle durcit le contrôle social car elle appelle à encore et toujours plus de protection et de sécurité, au risque de sacrifier les libertés individuelles.","source":{"title":"Libertés et sûreté dans un monde dangereux, résumé du cours, Annuaire du Collège de France","year":2009,"url":"https://www.college-de-france.fr/media/mireille-delmas-marty/UPL20008_delmas_marty_res0809.pdf","archive":["research/sources/penseurs/delmas-marty-libertes-surete-2009.pdf"]}},{"axis":"liberties","pole":"high","authors":["hobbes"],"featured":true,"thesis":"Sans un pouvoir commun assez fort pour se faire craindre, les hommes restent en guerre de chacun contre chacun : la sécurité exige un souverain supérieur aux particuliers.","nuance":"La liberté des sujets subsiste là où la loi se tait.","quote":"Et les conventions, sans l'épée, ne sont que des mots, et n'ont pas du tout de force pour mettre en sécurité un homme.","source":{"title":"Léviathan, chapitre XVII, traduction Philippe Folliot, Les Classiques des sciences sociales","year":1651,"url":"https://classiques.uqam.ca/classiques/hobbes_thomas/leviathan/leviathan_partie_2/leviathan_2e_partie.pdf","archive":["research/sources/penseurs/hobbes-leviathan-2e-partie-folliot.pdf"]}},{"axis":"liberties","pole":"high","authors":["r-posner"],"featured":true,"thesis":"Face au terrorisme, le mandat judiciaire préalable arbitre mal entre sécurité et liberté : une surveillance efficace ne peut se limiter aux suspects déjà identifiés.","nuance":"Il propose d’autres garde-fous, comme un contrôle parlementaire, et raisonne sur le droit américain.","source":{"title":"Privacy, Surveillance, and Law, University of Chicago Law Review","year":2008,"url":"https://lawreview.uchicago.edu/sites/default/files/75_1_Posner.pdf","archive":["research/sources/penseurs/posner-privacy-surveillance-law-2008.pdf"]}},{"axis":"liberties","pole":"high","authors":["e-posner","vermeule"],"featured":false,"thesis":"En situation d’urgence, les garanties constitutionnelles peuvent être assouplies ; la crainte d’un emballement irréversible est, selon eux, mal fondée.","nuance":"Leur thèse vaut pour les urgences nationales, non pour la police ordinaire.","source":{"title":"Accommodating Emergencies, Stanford Law Review, résumé de la faculté de droit de Harvard","year":2003,"url":"https://hls.harvard.edu/bibliography/accommodating-emergencies/","archive":["research/sources/penseurs/posner-vermeule-accommodating-emergencies.html"]}},{"axis":"religion","pole":"low","authors":["locke"],"featured":true,"thesis":"L’État ne protège que les intérêts civils : ce qui est permis à tous dans la vie ordinaire ne peut être interdit parce qu’on le fait par religion.","nuance":"Sa tolérance excluait les athées ; son texte porte sur le culte, non sur les signes religieux.","quote":"La loi ne saurait empêcher aucune assemblée religieuse, ni les prêtres d'aucune secte, de tourner à un saint usage ce qui est permis à tous les autres sujets dans la vie ordinaire et civile.","source":{"title":"Lettre sur la tolérance, traduction Le Clerc (1710), Wikisource","year":1689,"url":"https://fr.wikisource.org/wiki/Lettre_sur_la_tol%C3%A9rance","archive":["research/sources/penseurs/locke-lettre-tolerance.html"]}},{"axis":"religion","pole":"low","authors":["bauberot"],"featured":true,"thesis":"Pour ce qui est réversible, comme un vêtement, mieux vaut convaincre que contraindre ; tout pouvant être lu comme un signe religieux, les interdictions tendent à s’étendre.","nuance":"Il admet la contrainte pour l’irréversible, comme le mariage forcé, et défend la police des cultes de la loi de 1905.","quote":"Autant il me semble normal de recourir à la contrainte pour ce qui relève de l'irréversible, autant, pour tout ce qui est réversible, je pense qu'il est préférable de chercher à convaincre.","source":{"title":"Audition par la commission spéciale sur le projet de loi confortant le respect des principes de la République, Assemblée nationale","year":2020,"url":"https://www.assemblee-nationale.fr/dyn/15/comptes-rendus/csprincrep/l15csprincrep2021005_compte-rendu.pdf","archive":["research/sources/penseurs/bauberot-audition-an-2020-12-21.pdf"]}},{"axis":"religion","pole":"high","authors":["badinter"],"featured":true,"thesis":"La neutralité religieuse peut être exigée au-delà des agents publics : elle a soutenu la crèche associative Baby-Loup, qui l’imposait à ses salariées.","nuance":"Baby-Loup est une petite association subventionnée, non une entreprise commerciale ; elle n’a pas demandé de restreindre l’expression religieuse dans la rue, hors dissimulation du visage.","quote":"C’est pourquoi Baby-Loup est un double symbole : symbole de la laïcité, symbole de la cause des femmes.","source":{"title":"La laïcité menacée. Appel à soutenir Baby-Loup, reproduit par Mezetulle","year":2014,"url":"https://www.mezetulle.fr/elisabeth-badinter-laicite-menacee-appel-soutenir-baby-loup/","archive":["research/sources/penseurs/badinter-appel-baby-loup-2014.html"]}},{"axis":"religion","pole":"high","authors":["kintzler"],"featured":true,"thesis":"L’autorité publique, et l’école en particulier, doit s’abstenir de toute expression religieuse ; elle étend cette exigence aux parents qui accompagnent les sorties scolaires.","nuance":"Elle refuse d’imposer cette abstention à la société civile, rue, commerces ou transports, et qualifie cette extension d’« extrémisme laïc ».","quote":"j'ai également coécrit et signé un texte pour demander que ces accompagnateurs scolaires soient tenus de protéger la liberté de conscience des élèves.","source":{"title":"Audition par la commission spéciale sur le projet de loi confortant le respect des principes de la République, Assemblée nationale","year":2021,"url":"https://www.assemblee-nationale.fr/dyn/15/comptes-rendus/csprincrep/l15csprincrep2021034_compte-rendu.pdf","archive":["research/sources/penseurs/kintzler-audition-an-2021-01-15.pdf"]}},{"axis":"religion","pole":"high","authors":["hobbes"],"featured":false,"thesis":"L’État étant une seule personne, le souverain peut commander un culte public uniforme.","nuance":"Il distingue ce culte public de la foi intérieure, sur laquelle la loi n’a pas de prise.","quote":"Mais étant donné qu'une République n'est qu'une seule personne, elle doit aussi rendre à Dieu un seul culte, ce qu'elle fait quand elle ordonne que ce culte soit rendu publiquement par les particuliers.","source":{"title":"Léviathan, chapitre XXXI, traduction Philippe Folliot, Les Classiques des sciences sociales","year":1651,"url":"https://classiques.uqam.ca/classiques/hobbes_thomas/leviathan/leviathan_partie_2/leviathan_2e_partie.pdf","archive":["research/sources/penseurs/hobbes-leviathan-2e-partie-folliot.pdf"]}},{"axis":"immigration","pole":"low","authors":["heran"],"featured":true,"thesis":"Les migrations sont une composante ordinaire des sociétés et reposent de plus en plus sur des droits, familiaux ou d’asile, que la France a contribué à bâtir ; l’image d’une France « submergée » ne résiste pas aux comparaisons.","nuance":"Il ne plaide pas pour l’ouverture des frontières et refuse de pousser le curseur dans une seule direction.","quote":"la France peut-elle considérer comme une contrainte extérieure un droit international qu’elle a contribué à bâtir ? Peut-elle prôner une universalité fermée ?","source":{"title":"Migrations et sociétés, résumé de la leçon inaugurale, Annuaire du Collège de France","year":2018,"url":"https://college-de-france.fr/sites/default/files/documents/francois-heran/UPL7518490759684155479_527_536_43_Heran.pdf","archive":["research/sources/penseurs/heran-lecon-inaugurale-resume-2018.pdf"]}},{"axis":"immigration","pole":"low","authors":["carens"],"featured":true,"thesis":"L’égal respect dû à chaque personne laisse peu de justification à l’exclusion des migrants pauvres qui veulent rejoindre les pays riches.","nuance":"C’est un argument d’idéal de justice ; ses travaux ultérieurs raisonnent aussi dans le cadre d’un contrôle par les États.","source":{"title":"Aliens and Citizens: The Case for Open Borders, The Review of Politics","year":1987,"url":"https://www.cambridge.org/core/services/aop-cambridge-core/content/view/S0034670500033817","archive":["research/sources/penseurs/carens-aliens-and-citizens-1987.html"]}},{"axis":"immigration","pole":"low","authors":["wihtol-de-wenden"],"featured":false,"thesis":"Les engagements en matière de droits humains empêchent de fermer les frontières ; de nombreux travaux plaident pour davantage de voies légales de migration plutôt que pour la dissuasion.","nuance":"Elle parle d’ouvrir davantage les frontières, non d’abolir les contrôles.","quote":"Beaucoup de travaux académiques et d’experts convergent dans leurs conclusions sur la nécessité d’ouvrir davantage les frontières, de renoncer au tout sécuritaire et à la stratégie de dissuasion","source":{"title":"L’immigration, trois questions à Catherine Wihtol de Wenden, IRIS","year":2017,"url":"https://www.iris-france.org/86479-limmigration-3-questions-a-catherine-wihtol-de-wenden/","archive":["research/sources/penseurs/wihtol-de-wenden-iris-2017.html"]}},{"axis":"immigration","pole":"high","authors":["tribalat"],"featured":true,"thesis":"La politique migratoire devrait redevenir un exercice de souveraineté qui règle l’immigration selon l’intérêt général ; le droit européen et la jurisprudence limitent aujourd’hui cette capacité.","nuance":"Elle décrit des contraintes juridiques sans proposer de plafond chiffré.","quote":"Normalement la politique migratoire est un exercice de souveraineté visant à réguler l’immigration étrangère en fonction de l’intérêt général.","source":{"title":"Les impasses de la politique migratoire","year":2020,"url":"https://www.micheletribalat.fr/435984650/446554436","archive":["research/sources/penseurs/tribalat-impasses-politique-migratoire-2020.html"]}},{"axis":"immigration","pole":"high","authors":["miller"],"featured":true,"thesis":"Un État peut limiter le rythme et le nombre des admissions pour préserver sa culture publique et maîtriser l’évolution de sa population, tout en accueillant les réfugiés.","nuance":"Il refuse toute sélection selon l’origine et juge inacceptable une classe durable de non-citoyens, sans-papiers compris.","source":{"title":"Immigration: The Case for Limits, Contemporary Debates in Applied Ethics","year":2005,"url":"https://icmigrations.cnrs.fr/wp-content/uploads/2024/03/LECTURE-4-David-Miller-Immigration-the-case-for-limits.pdf","archive":["research/sources/penseurs/miller-immigration-case-for-limits-2005.pdf"]}},{"axis":"immigration","pole":"high","authors":["kant"],"featured":false,"thesis":"Tout étranger a le droit de ne pas être traité en ennemi, mais ce droit de visite n’est pas un droit de s’établir : on peut refuser de le recevoir si sa vie n’en est pas menacée.","nuance":"Le texte vise les voyages, le commerce et la conquête coloniale, non les migrations de travail.","quote":"le droit qu’a tout étranger de ne pas être traité en ennemi dans le pays où il arrive. On peut refuser de le recevoir, si l’on ne compromet point par là son existence","source":{"title":"Projet de paix perpétuelle, troisième article définitif, traduction Barni (1853), Wikisource","year":1795,"url":"https://fr.wikisource.org/wiki/Projet_de_paix_perp%C3%A9tuelle","archive":["research/sources/penseurs/kant-projet-paix-perpetuelle-barni.html"]}},{"axis":"integration","pole":"low","authors":["kymlicka"],"featured":true,"thesis":"Les politiques multiculturelles, comme le soutien aux associations culturelles, construisent une citoyenneté démocratique : il s’agit d’encadrer les revendications des groupes par les droits, non de les supprimer.","nuance":"Il ne défend aucune pratique contraire aux droits et rejette un multiculturalisme réduit à la célébration de différences figées.","source":{"title":"Multiculturalism: Success, Failure, and the Future, Migration Policy Institute","year":2012,"url":"https://ej.issuelab.org/resources/13140/13140.pdf","archive":["research/sources/penseurs/kymlicka-multiculturalism-mpi-2012.pdf"]}},{"axis":"integration","pole":"low","authors":["wieviorka"],"featured":true,"thesis":"Le multiculturalisme consiste à articuler les valeurs universelles du droit et la reconnaissance, y compris publique, des différences culturelles.","nuance":"Il se tient à distance du communautarisme comme d’un « universalisme abstrait ».","quote":"l’effort » pour articuler – et non pas opposer – les valeurs universelles du droit et de la raison, et la reconnaissance, y compris dans l’espace public, des différences culturelles.","source":{"title":"Les termes du débat gouvernemental sont biaisés, entretien, Politis","year":2011,"url":"https://www.politis.fr/articles/2011/03/les-termes-du-debat-gouvernemental-sont-biaises-13356/","archive":["research/sources/penseurs/wieviorka-politis-2011.html"]}},{"axis":"integration","pole":"low","authors":["taylor"],"featured":false,"thesis":"La non-reconnaissance d’une identité peut être une forme d’oppression ; un libéralisme qui applique uniformément les mêmes règles reste inhospitalier à la différence.","nuance":"Il admet qu’une société poursuive des buts culturels collectifs, comme la survie du français au Québec.","source":{"title":"The Politics of Recognition, dans Multiculturalism, Princeton University Press","year":1994,"url":"https://web.ics.purdue.edu/~drkelly/TaylorPoliticsOfRecognition1994.pdf","archive":["research/sources/penseurs/taylor-politics-of-recognition-1994.pdf"]}},{"axis":"integration","pole":"high","authors":["tribalat"],"featured":true,"thesis":"L’assimilation, qui accorde un privilège à la culture de la société d’accueil, est éthiquement fondée : s’installer en France engage à en adopter les modes de vie.","nuance":"Elle n’exclut pas les apports des nouveaux venus et distingue l’assimilation d’un « culturalisme ».","quote":"L’assimilation accorde un privilège à la culture de la société d’accueil. Vue d’un mauvais œil aujourd’hui, elle est pourtant parfaitement fondée éthiquement.","source":{"title":"Intégration, la fin du modèle français, Commentaire","year":2015,"url":"https://www.micheletribalat.fr/434872084/435558977","archive":["research/sources/penseurs/tribalat-integration-fin-modele-2015.html"]}},{"axis":"integration","pole":"high","authors":["finkielkraut"],"featured":true,"thesis":"L’école doit transmettre la langue, la littérature et la culture françaises à tous les élèves, quelle que soit leur origine.","nuance":"Son propos est autobiographique : ses parents voulaient qu’il assimile la culture française sans renoncer à son identité juive.","quote":"Ce qu’ils voulaient ardemment néanmoins, c’est que j’assimile la langue, la littérature, la culture française. Et ils pouvaient, à l’époque, compter sur l’école.","source":{"title":"Discours de réception à l’Académie française","year":2016,"url":"https://www.academie-francaise.fr/discours-de-reception-de-m-alain-finkielkraut","archive":["research/sources/penseurs/finkielkraut-discours-reception-academie-2016.html"]}},{"axis":"integration","pole":"high","authors":["schnapper"],"featured":false,"thesis":"Les démocraties européennes mènent de fait une politique d’intégration : elles respectent les identités de chacun mais en limitent l’expression collective dans l’espace public.","nuance":"Elle distingue cette intégration civique de l’assimilation aux traditions.","quote":"les exigences démocratiques et l’évolution de l’État providence conduisent tous les pays européens à mener en fait une politique d’intégration, en respectant les identités de chacun, mais en limitant leur expression collective dans l’espace public.","source":{"title":"Intégration nationale et intégration des migrants : un enjeu européen, Questions d’Europe n° 90, Fondation Robert Schuman","year":2008,"url":"https://old.robert-schuman.eu/fr/doc/questions-d-europe/qe-90-fr.pdf","archive":["research/sources/penseurs/schnapper-integration-questions-europe-90.pdf"]}},{"axis":"integration","pole":"high","authors":["durkheim"],"featured":false,"thesis":"Une société ne vit que si l’éducation fixe chez l’enfant les similitudes essentielles qu’exige la vie collective.","nuance":"Il parle de la société en général, non des immigrés, et juge nécessaire une certaine diversité des professions.","quote":"La société ne peut vivre que s’il existe entre ses membres une suffisante homogénéité : l’éducation perpétue et renforce cette homogénéité en fixant d’avance dans l’âme de l’enfant les similitudes essentielles que réclame la vie collective.","source":{"title":"Éducation et sociologie, chapitre I, Wikisource","year":1922,"url":"https://fr.wikisource.org/wiki/%C3%89ducation_et_sociologie/Chapitre_1","archive":["research/sources/penseurs/durkheim-education-sociologie-ch1.html"]}},{"axis":"integration","pole":"high","authors":["renan"],"featured":false,"thesis":"La nation repose à la fois sur un héritage de souvenirs possédé en commun et sur le consentement présent à vivre ensemble.","nuance":"Il refuse de fonder la nation sur la race, la langue ou la religion ; sa définition par le consentement est aussi invoquée par les tenants du pluralisme.","quote":"L’une est la possession en commun d’un riche legs de souvenirs ; l’autre est le consentement actuel, le désir de vivre ensemble, la volonté de continuer à faire valoir l’héritage qu’on a reçu indivis.","source":{"title":"Qu’est-ce qu’une nation ?, conférence en Sorbonne, Wikisource","year":1882,"url":"https://fr.wikisource.org/wiki/Qu%E2%80%99est-ce_qu%E2%80%99une_nation_%3F","archive":["research/sources/penseurs/renan-qu-est-ce-qu-une-nation-1882.html"]}},{"axis":"discrimination","pole":"low","authors":["p-simon"],"featured":true,"thesis":"Les politiques sociales générales reproduisent les inégalités liées à l’origine qu’elles prétendent réparer : il faut mesurer ces écarts et cibler l’action.","nuance":"Il propose des indicateurs comparés, sur le modèle de l’égalité entre les femmes et les hommes, plutôt que des quotas.","quote":"Le problème des politiques sociales généralistes est qu’elles reproduisent dans leur mise en œuvre les inégalités qu’elles sont censées réparer.","source":{"title":"Il n’existe pas de politique de lutte contre les discriminations sans statistiques, entretien, Observatoire des inégalités","year":2010,"url":"https://www.inegalites.fr/Il-n-existe-pas-de-politique-de-lutte-contre-les-discriminations-sans","archive":["research/sources/penseurs/simon-observatoire-inegalites-2010.html"]}},{"axis":"discrimination","pole":"low","authors":["anderson"],"featured":true,"thesis":"L’action positive fondée sur l’origine se justifie comme remède à la ségrégation de fait ; le principe d’indifférence à la couleur ne dit pas ce qui rend une préférence injuste.","nuance":"Elle raisonne sur le droit américain, modifié par la Cour suprême en 2023 ; le droit
