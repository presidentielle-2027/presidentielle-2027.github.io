server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # L'application utilise des fragments # : aucune réécriture SPA nécessaire.
    location / {
        try_files $uri $uri/ =404;
    }

    # Déclarer explicitement le type des modules, même avec une table MIME ancienne.
    location ~ \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }
}
